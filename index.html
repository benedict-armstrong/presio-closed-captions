<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* Placed by render(): sized to the page and, where the slide area has a
     bar beside the page big enough for it, moved into the bar. */
  .captions {
    position: absolute; transform: translateX(-50%);
    width: max-content; box-sizing: border-box;
    display: flex; flex-direction: column; justify-content: flex-end;
    overflow: hidden;
    padding: .25em .6em; border-radius: .3em;
    background: rgba(0, 0, 0, .78); color: #fff;
    line-height: 1.3; text-align: center;
    transition: opacity .4s;
  }
  .captions.hidden { opacity: 0; }
  /* Draggable: the presenter's copy moves them for everyone, a viewer's
     only on their own screen. */
  .captions.movable { cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; }
  .captions.movable:active { cursor: grabbing; }
  .live { opacity: .75; }
  /* A viewer's own switch: the CC pill turns the captions on and off on
     their screen. */
  .cc {
    position: absolute; left: 8px; bottom: 8px; box-sizing: border-box;
    height: 22px; padding: 0 7px; border: 0; border-radius: 11px;
    font: 600 12px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #fff; background: rgba(0, 0, 0, .78); cursor: pointer; opacity: .55;
  }
  .cc:hover { opacity: 1; }
  .cc.off { text-decoration: line-through; opacity: .4; }
  .cc[hidden] { display: none; }
</style>
</head>
<body>
<div class="captions hidden" id="captions"><div><span id="final"></span> <span class="live" id="live"></span></div></div>
<button type="button" class="cc" id="cc" hidden aria-label="Captions on this screen">CC</button>

<script>
  // Closed captions for Presio. One file, two surfaces:
  //  - background (presenter's device): runs the browser's speech recognition
  //    while captions are on, and sends what it hears to every device;
  //  - slide (presenter's current slide and every viewer): draws the captions
  //    over the slide.
  //
  // Messages (all from the presenter):
  //  - "state" { on } (retained): captions on or off — late joiners, and a
  //    reloaded presenter page, pick it up;
  //  - "live" { text } (volatile): the words so far of the sentence being said;
  //  - "line" { text }: a finished sentence;
  //  - "pos" { x, y } (retained once dropped): where the presenter dragged
  //    the captions, their center as page fractions; null puts them back.

  if (presio.surface === "background") background();
  else if (presio.surface === "slide") slide();

  function background() {
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    // Whether this browser can listen to a chosen microphone: start(track)
    // throws a TypeError for anything but a track where it's supported, and
    // ignores the argument (and starts) where it isn't.
    const canPickMic = Recognition && (() => {
      const probe = new Recognition();
      try {
        probe.start(0);
      } catch (err) {
        return err instanceof TypeError;
      }
      probe.abort();
      return false;
    })();
    // The menu's "use the system's microphone" item.
    const SYSTEM_MIC = "system";

    let on = false;
    let rec = null;
    let error = "";
    // Something's wrong but captions keep trying (the mic is busy elsewhere,
    // the speech service is unreachable); cleared by the next words heard.
    let warning = "";
    let lastLive = "";
    // Recognition ends by itself (silence, a minute of speech, a network
    // hiccup); while captions are on it's restarted, backing off if it keeps
    // ending straight away, and giving up if it never gets going.
    let startedAt = 0;
    let quickEnds = 0;
    let restartTimer = null;
    // The chosen microphone's stream, kept while captions are on.
    let stream = null;
    // Bumped by stop(), so a start still waiting for its microphone gives up.
    let generation = 0;
    let mics = [];
    // The level meter on the button while captions are on: three bars for
    // the voice's low, middle and high frequencies ("▂▅▃").
    let meter = null;
    let bars = "";

    // The chosen microphone: kept on this device only (device ids are this
    // browser's own), with its name to find it again if its id changes.
    function chosenMic() {
      const saved = presio.storage.get("mic");
      if (!saved || !saved.id) return null;
      return mics.find((m) => m.deviceId === saved.id) || mics.find((m) => m.label && m.label === saved.label) || null;
    }

    function menu() {
      const entries = [{ heading: "Microphone" }];
      if (!canPickMic) {
        entries.push({ id: SYSTEM_MIC, label: "System default", checked: true });
        entries.push({ id: "unsupported", label: "This browser can't pick one", disabled: true });
        return entries;
      }
      const chosen = chosenMic();
      entries.push({ id: SYSTEM_MIC, label: "System default", checked: !chosen });
      const named = mics.filter((m) => m.label);
      for (const m of named) entries.push({ id: m.deviceId, label: m.label, checked: !!chosen && chosen.deviceId === m.deviceId });
      // Browsers only name microphones once the page may use one.
      if (!named.length) entries.push({ id: "reveal", label: "Show microphones…" });
      return entries;
    }

    function renderButton() {
      if (!Recognition) {
        presio.ui.setButton("toggle", { disabled: true, label: "No captions here" });
        return;
      }
      presio.ui.setButton("toggle", {
        active: on,
        label: error || (on && warning) || (on ? `Captions on${bars ? " " + bars : ""}` : "Captions"),
        menu: menu(),
      });
    }

    async function refreshMics() {
      if (!canPickMic || !navigator.mediaDevices) return;
      try {
        // "default" and "communications" are Chrome's aliases for real
        // devices, which are listed too; "System default" stands for them.
        mics = (await navigator.mediaDevices.enumerateDevices()).filter(
          (d) => d.kind === "audioinput" && d.deviceId !== "default" && d.deviceId !== "communications"
        );
      } catch {
        mics = [];
      }
      renderButton();
    }

    async function pickMic(id) {
      if (id === "reveal") {
        try {
          const s = await navigator.mediaDevices.getUserMedia({ audio: true });
          s.getTracks().forEach((t) => t.stop());
        } catch {
          error = "Mic blocked";
        }
        await refreshMics();
        return;
      }
      const mic = mics.find((m) => m.deviceId === id);
      presio.storage.set("mic", mic ? { id: mic.deviceId, label: mic.label } : undefined);
      renderButton();
      // Listen to the new one straight away.
      if (on) {
        stop();
        start();
        startMeter();
      }
    }

    function setOn(next) {
      if (next && !Recognition) return;
      on = next;
      error = "";
      warning = "";
      quickEnds = 0;
      presio.send("state", { on }, { retain: true });
      if (on) {
        start();
        startMeter();
      } else {
        stop();
        stopMeter();
      }
      renderButton();
    }

    // How loud the microphone is, drawn on the button. Its own capture of the
    // same microphone: speech recognition doesn't share its audio. Each bar
    // is how far its band is above the room's noise, which it learns: the
    // floor drops to any quieter reading and creeps back up slowly.
    const LEVELS = "▁▂▃▄▅▆▇█";
    const BANDS = [[100, 400], [400, 1200], [1200, 4000]];
    // How far above the floor fills a bar: voices are quieter up high.
    const FULL = [0.25, 0.2, 0.12];
    async function startMeter() {
      stopMeter();
      if (!navigator.mediaDevices || !window.AudioContext) return;
      const token = {};
      meter = { token };
      const mic = canPickMic && chosenMic();
      let s;
      try {
        s = await navigator.mediaDevices.getUserMedia({ audio: mic ? { deviceId: { exact: mic.deviceId } } : true });
      } catch {
        if (meter && meter.token === token) meter = null;
        return;
      }
      if (!meter || meter.token !== token) {
        s.getTracks().forEach((t) => t.stop());
        return;
      }
      const ctx = new AudioContext();
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.5;
      ctx.createMediaStreamSource(s).connect(analyser);
      const data = new Uint8Array(analyser.frequencyBinCount);
      const hz = ctx.sampleRate / analyser.fftSize;
      const bins = BANDS.map(([lo, hi]) => [Math.floor(lo / hz), Math.ceil(hi / hz)]);
      const floor = bins.map(() => 1);
      // A timer, not requestAnimationFrame: this frame is never drawn.
      const timer = setInterval(() => {
        if (ctx.state === "suspended") ctx.resume().catch(() => {});
        analyser.getByteFrequencyData(data);
        const next = bins
          .map(([a, b], i) => {
            let sum = 0;
            for (let k = a; k < b; k++) sum += data[k];
            const v = sum / (b - a) / 255;
            floor[i] = v < floor[i] ? v : floor[i] + 0.0005;
            const level = (v - floor[i] - 0.02) / FULL[i];
            return LEVELS[Math.max(0, Math.min(LEVELS.length - 1, Math.round(level * (LEVELS.length - 1))))];
          })
          .join("");
        if (next !== bars) {
          bars = next;
          renderButton();
        }
      }, 100);
      meter = { token, stream: s, ctx, timer };
    }

    function stopMeter() {
      if (meter && meter.timer) {
        clearInterval(meter.timer);
        meter.stream.getTracks().forEach((t) => t.stop());
        meter.ctx.close().catch(() => {});
      }
      meter = null;
      bars = "";
    }

    // The chosen microphone's audio track, or null for the system's.
    async function micTrack() {
      const mic = canPickMic && chosenMic();
      if (!mic) return null;
      const live = stream && stream.getAudioTracks()[0];
      if (live && live.readyState === "live") return live;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: { exact: mic.deviceId } } });
        return stream.getAudioTracks()[0];
      } catch (err) {
        console.warn("Closed captions: can't open the chosen microphone, using the system's", err);
        warning = "Chosen mic unavailable";
        renderButton();
        return null;
      }
    }

    async function start() {
      clearTimeout(restartTimer);
      if (rec) return;
      const current = generation;
      const r = new Recognition();
      rec = r;
      const track = await micTrack();
      if (generation !== current || rec !== r) return;
      r.lang = presio.settings.get("language") || navigator.language;
      r.continuous = true;
      r.interimResults = true;
      r.onresult = (e) => {
        if (warning) {
          warning = "";
          renderButton();
        }
        let live = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const text = e.results[i][0].transcript.trim();
          if (!text) continue;
          if (e.results[i].isFinal) presio.send("line", { text });
          else live += (live ? " " : "") + text;
        }
        if (live !== lastLive) {
          lastLive = live;
          presio.send("live", { text: live }, { volatile: true });
        }
      };
      r.onerror = (e) => {
        const fatal = {
          "not-allowed": "Mic blocked",
          "service-not-allowed": "Mic blocked",
          "audio-capture": "No microphone",
          "language-not-supported": "Language unsupported",
        }[e.error];
        if (fatal) {
          setOn(false);
          error = fatal;
          renderButton();
          return;
        }
        // Chrome runs one recognizer at a time: another tab (or window)
        // with captions on takes the microphone from this one.
        const next = { aborted: "Mic in use elsewhere", network: "Captions offline" }[e.error];
        if (next && next !== warning) {
          warning = next;
          renderButton();
        }
      };
      r.onend = () => {
        rec = null;
        if (lastLive) {
          lastLive = "";
          presio.send("live", { text: "" }, { volatile: true });
        }
        if (!on) return;
        quickEnds = Date.now() - startedAt < 2000 ? quickEnds + 1 : 0;
        if (quickEnds >= 6) {
          const reason = warning || "Captions stopped";
          setOn(false);
          error = reason;
          renderButton();
          return;
        }
        restartTimer = setTimeout(start, Math.min(250 * 2 ** quickEnds, 10000));
      };
      startedAt = Date.now();
      try {
        if (track) r.start(track);
        else r.start();
      } catch (err) {
        console.error(err);
        rec = null;
      }
    }

    function stop() {
      generation++;
      clearTimeout(restartTimer);
      const r = rec;
      rec = null;
      if (r) {
        r.onend = null;
        r.abort();
      }
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
        stream = null;
      }
      lastLive = "";
    }

    presio.onButton("toggle", () => setOn(!on));
    presio.onCommand("toggle", () => setOn(!on));
    presio.onMenu("toggle", (id) => pickMic(id));
    if (canPickMic && navigator.mediaDevices) navigator.mediaDevices.addEventListener("devicechange", refreshMics);
    // A new language needs a new recognizer.
    presio.settings.onChange(() => {
      if (on) {
        stop();
        start();
      }
    });
    // Captions were on before this page reloaded: carry on.
    presio.onMessage(({ type, payload, from }) => {
      if (type === "state" && from === "presenter" && payload && payload.on && !on) setOn(true);
    });
    renderButton();
    refreshMics();
  }

  function slide() {
    const box = document.getElementById("captions");
    const finalEl = document.getElementById("final");
    const liveEl = document.getElementById("live");
    const presenter = presio.role === "presenter";
    let on = false;
    let finals = "";
    let live = "";
    let fadeTimer = null;
    // Where the presenter dragged the captions, for everyone: the box's
    // center as page fractions (outside 0–1 in the bars around the page), or
    // null to place them by the settings.
    let moved = null;
    // A viewer's own spot, on their device only; it wins over the
    // presenter's until they double-click to follow the presenter again.
    const OWN_KEY = "presio-closed-captions:position";
    let own = presenter ? null : loadOwn();
    // A viewer can hide the captions on their screen; the presenter has the
    // button (and the "show on your own slide" setting) for theirs.
    const MUTED_KEY = "presio-closed-captions:hidden";
    const ccEl = document.getElementById("cc");
    let muted = !presenter && load(MUTED_KEY) === true;
    let drag = null;
    // Text size, as a fraction of the page's width.
    const SIZES = { small: 0.022, medium: 0.03, large: 0.04 };

    function render() {
      const s = presio.settings.all;
      const shown = on && (!presenter || s.showOnPresenter !== false);
      const lines = Math.max(1, Math.min(4, Number(s.lines) || 2));
      box.className = "captions movable";
      finalEl.textContent = finals;
      liveEl.textContent = live;
      place(lines, s.position === "top", SIZES[s.size] || SIZES.medium);
      const visible = shown && !muted && !!(finals || live);
      if (!visible) box.classList.add("hidden");
      // The CC pill: a viewer's switch, there whenever captions are on.
      ccEl.hidden = presenter || !on;
      ccEl.classList.toggle("off", muted);
      ccEl.setAttribute("aria-pressed", String(!muted));
      ccEl.title = muted ? "Show captions on this screen" : "Hide captions on this screen";
      updateInteractive(visible);
    }

    // Where the page is in this surface: all of it on Presio versions that
    // size the surface to the page, else ("slideSurface": "area") somewhere
    // inside, with bars around it when its shape differs from the screen's.
    function pageBox() {
      const p = presio.ui.page || { x: 0, y: 0, w: 1, h: 1 };
      return { x: p.x * innerWidth, y: p.y * innerHeight, w: p.w * innerWidth, h: p.h * innerHeight };
    }

    function place(lines, top, size) {
      const W = innerWidth;
      const H = innerHeight;
      const page = pageBox();
      const style = box.style;
      style.maxHeight = `${lines * 1.3}em`;
      style.top = style.bottom = "";
      const spot = own || moved;
      if (spot) {
        // Where they were dragged to, kept on screen: a spot in a bar this
        // screen doesn't have comes back to the nearest edge.
        style.fontSize = `${page.w * size}px`;
        style.maxWidth = `${Math.min(W, page.w * 0.88)}px`;
        const w = box.offsetWidth;
        const h = box.offsetHeight;
        const cx = Math.min(Math.max(page.x + spot.x * page.w, w / 2), W - w / 2);
        const cy = Math.min(Math.max(page.y + spot.y * page.h, h / 2), H - h / 2);
        style.left = `${cx}px`;
        style.top = `${cy - h / 2}px`;
        return;
      }
      // The bar on the chosen side: captions go in it, off the slide, when
      // they fit there at no less than 70% of their size (shrunk to fit);
      // otherwise they sit on the slide's edge.
      const bar = top ? page.y : H - page.y - page.h;
      const gap = Math.max(4, bar * 0.08);
      const fits = (bar - 2 * gap) / (lines * 1.3);
      const inBar = fits >= page.w * size * 0.7;
      const font = inBar ? Math.min(page.w * size, fits) : page.w * size;
      const height = font * lines * 1.3;
      style.fontSize = `${font}px`;
      style.left = `${page.x + page.w / 2}px`;
      // In a bar they may use its full width; on the slide, most of the page's.
      style.maxWidth = `${(inBar ? Math.min(W, page.w * 1.1) : page.w * 0.88)}px`;
      if (top) style.top = `${inBar ? Math.max(0, (bar - height) / 2) : page.y + page.h * 0.05}px`;
      else style.bottom = `${inBar ? Math.max(0, (bar - height) / 2) : H - page.y - page.h + page.h * 0.05}px`;
    }

    // Dragging the captions: the presenter's move them for everyone, a
    // viewer's only on their own screen. The frame takes input over them only
    // (all of it mid-drag, so the drag can't slip off).
    let interactiveKey = "";
    function updateInteractive(visible) {
      let value = false;
      if (drag) value = true;
      else {
        const areas = [];
        if (visible) areas.push(box);
        if (!ccEl.hidden) areas.push(ccEl);
        if (areas.length) {
          value = areas.map((el) => {
            const r = el.getBoundingClientRect();
            return { x: r.left / innerWidth, y: r.top / innerHeight, w: r.width / innerWidth, h: r.height / innerHeight };
          });
        }
      }
      const key = JSON.stringify(value);
      if (key === interactiveKey) return;
      interactiveKey = key;
      presio.ui.setInteractive(value);
    }

    box.title = presenter
      ? "Drag to move the captions on every screen — double-click to put them back"
      : "Drag to move the captions on your screen — double-click to put them back";
    box.addEventListener("pointerdown", (e) => {
      if (e.button !== 0 || !e.isPrimary) return;
      e.preventDefault();
      // Touches reach this frame forwarded by Presio, and those can't be
      // captured here; Presio sends them all to this box regardless.
      try {
        box.setPointerCapture(e.pointerId);
      } catch {}
      const r = box.getBoundingClientRect();
      drag = { dx: e.clientX - (r.left + r.width / 2), dy: e.clientY - (r.top + r.height / 2), moved: false };
      updateInteractive(true);
    });
    box.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const page = pageBox();
      drag.moved = true;
      const spot = { x: round((e.clientX - drag.dx - page.x) / page.w), y: round((e.clientY - drag.dy - page.y) / page.h) };
      if (presenter) {
        moved = spot;
        // Viewers follow along; the spot it ends on is kept (below).
        presio.send("pos", spot, { volatile: true });
      } else own = spot;
      render();
    });
    const end = () => {
      if (!drag) return;
      const wasMoved = drag.moved;
      drag = null;
      render();
      if (!wasMoved) return;
      if (presenter) presio.send("pos", moved, { retain: true });
      else saveOwn(own);
    };
    box.addEventListener("pointerup", end);
    box.addEventListener("pointercancel", end);
    box.addEventListener("dblclick", () => {
      if (presenter) {
        moved = null;
        // A retained null forgets the spot, for devices joining later too.
        presio.send("pos", null, { retain: true });
      } else {
        own = null;
        saveOwn(null);
      }
      render();
    });

    function setMuted(next) {
      muted = next;
      save(MUTED_KEY, next || null);
      render();
    }
    ccEl.addEventListener("click", () => setMuted(!muted));

    // Plugin frames share the page's storage: the keys are this plugin's own.
    function loadOwn() {
      const v = load(OWN_KEY);
      return v && Number.isFinite(v.x) && Number.isFinite(v.y) ? { x: v.x, y: v.y } : null;
    }
    function saveOwn(spot) {
      save(OWN_KEY, spot);
    }
    function load(key) {
      try {
        return JSON.parse(localStorage.getItem(key) || "null");
      } catch {
        return null;
      }
    }
    function save(key, value) {
      try {
        if (value) localStorage.setItem(key, JSON.stringify(value));
        else localStorage.removeItem(key);
      } catch {}
    }

    function round(v) {
      return Math.round(v * 1e4) / 1e4;
    }

    function touched() {
      clearTimeout(fadeTimer);
      const seconds = Number(presio.settings.get("clearAfter")) || 6;
      fadeTimer = setTimeout(() => {
        finals = "";
        live = "";
        render();
      }, seconds * 1000);
      render();
    }

    presio.onMessage(({ type, payload, from }) => {
      if (from !== "presenter") return;
      if (type === "state") {
        on = !!(payload && payload.on);
        if (!on) {
          finals = "";
          live = "";
        }
        render();
      } else if (type === "live") {
        live = (payload && payload.text) || "";
        touched();
      } else if (type === "line") {
        // Keep only a tail: the box shows the last few lines anyway.
        finals = `${finals} ${(payload && payload.text) || ""}`.trim().slice(-600);
        live = "";
        touched();
      } else if (type === "pos") {
        const ok = payload && Number.isFinite(payload.x) && Number.isFinite(payload.y);
        moved = ok ? { x: payload.x, y: payload.y } : null;
        render();
      }
    });
    presio.settings.onChange(render);
    presio.onContextChange(render);
    if (presio.ui.onPageChange) presio.ui.onPageChange(render);
    window.addEventListener("resize", render);
    render();
  }
</script>
</body>
</html>
